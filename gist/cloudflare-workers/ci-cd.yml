name: CI/CD

# Build and verify every change; deploy previews for PRs and production from main.
# Deploy jobs depend on the quality gates, so nothing ships unverified.

on:
  push:
    branches: [main]
    # The SEO watch ledger is machine-written, is never part of dist/, and is
    # committed daily. Deploying the site again for it would be pure noise — and
    # would re-trigger the SEO ping through workflow_run every single day.
    paths-ignore:
      - '_source/seo-watch.json'
      # Same for the LinkedIn ledger: machine-written, never part of dist/, and
      # committed by linkedin.yml whenever a post is announced.
      - '_source/linkedin.json'
      # hub/ publishes to a different repo entirely and never reaches dist/,
      # so a change to it alone has nothing to deploy.
      - 'hub/**'
  pull_request:
    branches: [main]
  # A post carries the date it comes out, and build.mjs holds anything dated
  # ahead of today. Publishing later therefore needs a build on the day rather
  # than a person on the day — this is that build. The `due` job below decides
  # whether it has anything to publish, so an ordinary day costs one API call
  # and stops there.
  schedule:
    - cron: '9 14 * * *'      # 14:09 UTC daily — ~10am New York, when a new post is most read
  workflow_dispatch:

# Least privilege by default; individual jobs elevate only what they need.
permissions:
  contents: read

# Supersede in-flight runs for a branch, but never interrupt a production deploy.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # wrangler ships as a pinned devDependency; never phone home from CI
  WRANGLER_SEND_METRICS: "false"

jobs:
  # Only ever asked on a scheduled run: is there a post or an ASO report whose
  # date has arrived that the live site does not serve yet? Asking the live
  # sitemap rather than "is anything dated today" means a missed or delayed run
  # catches up by itself instead of leaving a page held forever.
  due:
    name: Anything due?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
      slugs: ${{ steps.check.outputs.slugs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # No npm ci: the script reads frontmatter and one sitemap, and nothing else.
      - name: Check the publishing queue
        id: check
        run: node scripts/schedule.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & verify
    needs: [due]
    # `due` is skipped on a push or a PR, which would skip everything downstream
    # of it without always(). The condition then says what it means: build for
    # every event except a scheduled run with nothing to publish.
    if: always() && (github.event_name != 'schedule' || needs.due.outputs.due == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history: the build derives its patch version from the commit count
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends webp

      - name: Install dependencies
        run: npm ci

      # The WebP derivatives are content-addressed on the source bytes plus the
      # encoder settings, so this only ever replays work that has not changed.
      # A miss is not a failure — the build just re-encodes and repopulates it.
      - name: Restore image derivative cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images
          key: webp-${{ hashFiles('public/assets/games/*.jpg', 'build.mjs') }}
          restore-keys: webp-

      - name: Build
        env:
          # A pull request renders the posts that are still held for a later
          # date, so a scheduled post can be read on the preview URL before it
          # ships. dist/ from this job is the artifact the production deploy
          # downloads, so the flag must never be set on a run that can deploy —
          # and a pull_request run is exactly the one that cannot.
          PREVIEW_SCHEDULED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: npm run build

      - name: Verify output
        run: npm run verify

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  lighthouse:
    name: Lighthouse budget
    needs: build
    # `due` is skipped on every event except the daily schedule, and a skip
    # propagates down the whole needs graph — build survives it with always(),
    # but everything after build inherited the skip and stopped running. That
    # silently disabled the preview AND the production deploy, because both
    # need this job. So each job below states what it actually requires.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run Lighthouse budget
        run: npm run lighthouse

  preview:
    name: Deploy preview
    needs: [build, lighthouse]
    # Skip where secrets are unavailable rather than failing:
    #  - fork PRs never receive them
    #  - Dependabot runs use a separate secret store, so repository secrets are
    #    empty even though the branch lives in this repo
    if: >-
      always() && needs.build.result == 'success' &&
      needs.lighthouse.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Upload preview version
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload 2>&1 | tee upload.log
          url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          if [ -z "$url" ]; then
            echo "::warning::could not parse a preview URL from wrangler output"
          else
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment preview URL
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- cf-preview -->';
            const body = `${marker}\n**Preview deployed** → ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = comments.data.find(c => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  production:
    name: Deploy production
    needs: [build, lighthouse]
    # A scheduled run only reaches here when `due` found a post to publish, and
    # a schedule always runs on the default branch, so the ref check holds.
    if: >-
      always() && needs.build.result == 'success' &&
      needs.lighthouse.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://www.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
