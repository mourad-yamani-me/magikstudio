name: Sync gist

# Publishes each gist/<dir>/ to its own public gist owned by the IndieCoreDev
# account, so a snippet linked from a blog post never drifts from the real
# configuration it was taken from.
#
# Deliberately separate from ci-cd.yml: deploying the site must not depend on
# the GitHub gist API, and this only needs to run when the source files change.
#
# Each gist is found by its description marker rather than a stored ID, so the
# first run creates it and every later run updates the same one. The markers
# and directories come from gist/gists.json, written by build-gist.mjs.

on:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - '.github/workflows/ci-cd.yml'
      - 'scripts/build-gist.mjs'
      # snippets the engine gists are generated from
      - '_source/snippets/**'
      - 'scripts/verify.mjs'
      - 'scripts/lighthouse-check.mjs'
      - 'gist/**'
  # A gist whose post is dated ahead is skipped below rather than published with
  # a link that 404s. Nothing would come back for it without a second look, so
  # this is that look: the same run, once a day, publishing whatever came due.
  schedule:
    - cron: '33 14 * * *'     # 14:33 UTC daily — after the site build that puts the post out
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gist
  cancel-in-progress: false

jobs:
  sync:
    name: Publish to gist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Regenerate gist files from the live config
        run: node scripts/build-gist.mjs

      - name: Create or update each gist
        env:
          # A classic PAT on the IndieCoreDev account, `gist` scope only.
          # The gists are owned by whichever account this token belongs to.
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GIST_TOKEN is not set — add it as a repository secret."
            exit 1
          fi

          echo "acting as: $(gh api user --jq .login)"
          echo "### Gists published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # dir<TAB>marker, one line per gist. `live` is the date the last post it
          # links back to comes out; publishing before then would ship a gist
          # whose "full write-up" link 404s. The daily schedule above catches it
          # the morning the post lands.
          node -e '
            const m = require("./gist/gists.json");
            const today = new Date().toISOString().slice(0, 10);
            for (const g of m.filter(g => g.live && g.live > today)) {
              console.error(`held: ${g.dir} until ${g.live}`);
            }
            const due = m.filter(g => !g.live || g.live <= today);
            process.stdout.write(due.map(g => `${g.dir}\t${g.marker}`).join("\n") + "\n");
          ' | while IFS=$'\t' read -r dir marker; do
            [ -n "$dir" ] || continue
            echo "── $dir"

            # Build the API payload from gist/<dir>/ without shelling out per file.
            DIR="$dir" MARKER="$marker" node -e '
              const fs = require("fs");
              const dir = "gist/" + process.env.DIR;
              const files = Object.fromEntries(
                fs.readdirSync(dir).map(f => [f, { content: fs.readFileSync(dir + "/" + f, "utf8") }])
              );
              fs.writeFileSync("payload.json", JSON.stringify({
                description: process.env.MARKER, public: true, files,
              }));
            '

            # Find an existing gist by its description, so no ID has to be stored.
            id=$(gh api /gists --paginate \
                   --jq "map(select(.description == \"$marker\")) | .[0].id // empty")

            if [ -n "$id" ]; then
              echo "   updating existing gist $id"
              url=$(gh api -X PATCH "/gists/$id" --input payload.json --jq .html_url)
            else
              echo "   no existing gist found — creating"
              url=$(gh api -X POST /gists --input payload.json --jq .html_url)
            fi

            echo "   $url"
            echo "- \`$dir\` → $url" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Put a gist URL in its post's \`code:\` frontmatter to render a link card." >> "$GITHUB_STEP_SUMMARY"
