name: Cross-post to dev.to

# Publishes any post carrying `devto: true` to dev.to, canonicalised back to
# this site. See docs/cross-posting.md for why dev.to specifically, and why the
# canonical is not optional.
#
# Deliberately separate from ci-cd.yml, for the same reason sync-gist.yml is:
# deploying the site must not depend on a third-party API being up, and this
# only needs to run when a post or an embedded snippet changes.
#
# Re-running is safe. Articles are matched by their canonical_url, so a second
# run updates the article the first one created rather than duplicating it, and
# an article whose stored markdown already matches is skipped entirely.
#
# The daily schedule is what lets every post carry `devto: true` at once.
# dev.to allows a new account one published article per five minutes, and a
# burst of nineteen would look like exactly what its moderators remove, so the
# script creates a small number per run and the schedule works through the
# backlog over days. Edits to articles that already exist are not capped.

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'gist/**'
      - 'scripts/devto.mjs'
      - 'scripts/gist-embed.mjs'
  schedule:
    - cron: '41 7 * * *'      # 07:41 UTC daily — off the hour, and clear of the SEO watch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devto
  cancel-in-progress: false

jobs:
  crosspost:
    name: Publish opted-in posts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Without the key there is nothing to do, and failing every push to main
      # over a secret that was never added is noise rather than a signal.
      - name: Check for the API key
        id: key
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ -z "${DEVTO_API_KEY:-}" ]; then
            echo "::notice::DEVTO_API_KEY is not set — skipping. Add it as a repository secret to enable cross-posting."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: What would be sent
        if: steps.key.outputs.have == 'true'
        run: node scripts/devto.mjs

      - name: Create or update each article
        if: steps.key.outputs.have == 'true'
        env:
          # dev.to → Settings → Extensions → DEV API Keys
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/devto.mjs --publish | tee out.txt
          {
            echo "### Cross-posted to dev.to"
            echo ""
            sed 's/^/- /' out.txt
          } >> "$GITHUB_STEP_SUMMARY"
