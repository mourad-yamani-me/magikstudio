version: 2
updates:
  # Keep pinned action SHAs current — Dependabot rewrites the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: [dependencies, ci]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: [dependencies]
    groups:
      dev-dependencies:
        patterns: ["*"]
